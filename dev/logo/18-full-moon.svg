<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a28"/><stop offset="1" stop-color="#151514"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <pattern id="lines" width="40" height="56" patternUnits="userSpaceOnUse"><rect width="40" height="30" fill="#efece6"/></pattern>
    <pattern id="dimlines" width="40" height="56" patternUnits="userSpaceOnUse"><rect width="40" height="30" fill="#3a3936"/></pattern>
    <pattern id="amberlines" width="40" height="56" patternUnits="userSpaceOnUse"><rect width="40" height="30" fill="#d9a94e"/></pattern>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="rgba(232,230,225,.10)"/>
  <clipPath id="moon"><circle cx="512" cy="512" r="250"/></clipPath>
  <g clip-path="url(#moon)">
    <rect x="262" y="262" width="500" height="500" fill="url(#dimlines)"/>
    <rect x="262" y="472" width="500" height="88" fill="#d9a94e" fill-opacity=".32"/>
    <rect x="262" y="504" width="420" height="30" fill="#efece6"/>
  </g>
  <rect x="692" y="470" width="26" height="96" rx="13" fill="#d9a94e"/>
</svg>
